# Dependabot：只追蹤 GitHub Actions（action 以 commit SHA 釘選，Dependabot 會一併更新版本註解）。
# prek hook 版本不在 Dependabot 支援範圍，以 `prek update` 手動更新（見 docs/development.md）。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Taipei
    cooldown:
      default-days: 7 # 新版發佈滿 7 天才提 PR，降低供應鏈攻擊風險（zizmor dependabot-cooldown）
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: build # 符合 AGENTS.md「Commits」：build(deps): …
      include: scope
